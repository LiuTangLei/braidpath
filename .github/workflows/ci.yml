name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s bench -p 'test_*.py'
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --all-targets --locked
      - run: cargo +stable run --locked --example loss_recovery
      - name: Preserve socket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-fixtures-${{ matrix.os }}
          retention-days: 7
          path: |
            local/test-failures/**/*.log
            local/test-failures/**/*.jsonl
          if-no-files-found: ignore
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --all-targets --locked
      - name: Preserve socket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-fixtures-msrv
          retention-days: 7
          path: |
            local/test-failures/**/*.log
            local/test-failures/**/*.jsonl
          if-no-files-found: ignore
