[package]
name = "braidpath"
version = "0.4.3"
edition = "2024"
rust-version = "1.88"
description = "Experimental FEC-assisted multipath transport over HTTP/3 datagrams"
license = "Apache-2.0"
repository = "https://github.com/LiuTangLei/braidpath"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4.3"
h3 = { version = "=0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "=0.0.10"
http = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.9"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
# Bound stream fragments by unread extent and coalesce mixed-size contiguous data.
quinn-proto = { path = "vendor/quinn-proto" }
# Lock-free connection hints and DATAGRAM admission wakeups.
quinn = { path = "vendor/quinn" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
assert_matches = "1"
tokio = { version = "1", features = ["test-util"] }

# Socket integration tests launch the test-profile executable at fixed packet
# rates and deadlines. Keep debug assertions, but avoid interpreting unoptimized
# codec/packet-trace overhead on small CI runners as network packet loss.
[profile.test]
opt-level = 1
